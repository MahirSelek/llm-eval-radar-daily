name: Daily Publish

on:
  workflow_dispatch:
  schedule:
    # Keep collecting/publishing even when local terminal is closed.
    - cron: "0 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Publish daily post
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ secrets.CURSOR_MODEL }}
          PUBLISHER_MODEL: ${{ secrets.PUBLISHER_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TZ: Europe/Istanbul
          # Cloud backup when Mac/agent is off — local AUTO_GIT_PUSH handles Mac-on path
          AUTO_GIT_PUSH: "0"
          ENABLE_LOCAL_SCHEDULER: "0"
        run: python -m eval_radar.cli publish

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content docs data/digests || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily eval post"
          git push || echo "main branch protected; skipping direct push"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
