name: Daily Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore posts from site-content archive
        run: |
          set -euo pipefail
          git fetch origin site-content:site-content || true
          if git show-ref --verify --quiet refs/heads/site-content || git show-ref --verify --quiet refs/remotes/origin/site-content; then
            git archive origin/site-content content 2>/dev/null | tar -x || true
            echo "Post files after restore:"
            ls content/posts 2>/dev/null | wc -l || echo 0
          else
            echo "site-content branch missing; starting from main only"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Publish daily post
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ secrets.CURSOR_MODEL }}
          PUBLISHER_MODEL: ${{ secrets.PUBLISHER_MODEL }}
          REPORT_TZ: Europe/Istanbul
          AUTO_GIT_PUSH: "0"
          ENABLE_LOCAL_SCHEDULER: "0"
        run: python -m eval_radar.cli publish

      - name: Rebuild docs from full post archive
        run: |
          python - <<'PY'
          from eval_radar.publish.site import load_posts_index, write_posts_index, build_docs_site
          posts = load_posts_index()
          write_posts_index(posts)
          build_docs_site(posts)
          print(f"docs rebuilt with {len(posts)} posts")
          print("top dates", [p.get("date") for p in posts[:12]])
          PY

      - name: Snapshot generated content
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/generated-content"
          cp -R content "$RUNNER_TEMP/generated-content/"
          cp -R docs "$RUNNER_TEMP/generated-content/"
          mkdir -p "$RUNNER_TEMP/generated-content/data"
          if [ -d data/digests ]; then
            cp -R data/digests "$RUNNER_TEMP/generated-content/data/"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Persist archive to site-content (unprotected)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin site-content:site-content || true
          ARCHIVE_DIR="$RUNNER_TEMP/site-content-worktree"
          rm -rf "$ARCHIVE_DIR"
          if git show-ref --verify --quiet refs/remotes/origin/site-content; then
            git worktree add --force "$ARCHIVE_DIR" origin/site-content
          elif git show-ref --verify --quiet refs/heads/site-content; then
            git worktree add --force "$ARCHIVE_DIR" site-content
          else
            git worktree add --force "$ARCHIVE_DIR" HEAD
          fi

          pushd "$ARCHIVE_DIR" >/dev/null
          if git show-ref --verify --quiet refs/remotes/origin/site-content; then
            git checkout -B site-content origin/site-content
          elif git show-ref --verify --quiet refs/heads/site-content; then
            git checkout -B site-content site-content
          else
            git checkout --orphan site-content
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf content docs data
          cp -R "$RUNNER_TEMP/generated-content/content" .
          cp -R "$RUNNER_TEMP/generated-content/docs" .
          mkdir -p data
          if [ -d "$RUNNER_TEMP/generated-content/data/digests" ]; then
            cp -R "$RUNNER_TEMP/generated-content/data/digests" data/
          fi

          git add -A content docs data/digests || true
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
          else
            git commit -m "chore: archive daily eval posts"
          fi
          git push -u origin HEAD:site-content
          popd >/dev/null
          git worktree remove --force "$ARCHIVE_DIR"

      - name: Best-effort sync to main
        continue-on-error: true
        run: |
          set -euo pipefail
          git checkout main
          git pull --rebase origin main || true
          rm -rf content docs
          cp -R "$RUNNER_TEMP/generated-content/content" .
          cp -R "$RUNNER_TEMP/generated-content/docs" .
          mkdir -p data
          if [ -d "$RUNNER_TEMP/generated-content/data/digests" ]; then
            cp -R "$RUNNER_TEMP/generated-content/data/digests" data/
          fi
          git add content docs data/digests || true
          if git diff --cached --quiet; then
            echo "main already up to date"
            exit 0
          fi
          git commit -m "chore: daily eval post"
          git push origin HEAD:main || echo "WARN: main push blocked by branch protection"
