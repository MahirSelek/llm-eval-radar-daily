[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-radar"
version = "0.1.0"
description = "LLM evaluation open-web radar + Telegram harness"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "python-telegram-bot>=21.6",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "feedparser>=6.0.11",
  "tzdata>=2024.1",
  "flask>=3.0.0",
  "cursor-sdk>=0.1.0",
]

[project.scripts]
eval-radar = "eval_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
