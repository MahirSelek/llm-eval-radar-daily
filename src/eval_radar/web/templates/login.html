<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giriş · Eval Radar 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <span class="brand-dot"></span>
      Eval <span>Radar</span>
    </div>
    <p class="login-sub">LLM Evaluation & Benchmark Command Terminal</p>

    <div class="login-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Loopback Isolated Dashboard
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}" style="text-align:left;font-size:0.82rem;padding:0.6rem 0.9rem;">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form class="login-form" method="post" action="{{ url_for('web.login_submit') }}">
      <input type="hidden" name="next" value="{{ next or url_for('web.home') }}" />
      <label for="password">Dashboard Güvenlik Şifresi</label>
      <input id="password" type="password" name="password" placeholder="••••••••••••" autocomplete="current-password" autofocus required />
      <button class="btn primary" type="submit">
        Giriş Yap ve Başlat
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
  </div>
</body>
</html>
